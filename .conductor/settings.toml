"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = """
pnpm install --frozen-lockfile
pnpm hooks:install
pnpm build
"""
archive = "true"
run_mode = "concurrent"

[scripts.run.web]
available_in = [ "local" ]
command = "pnpm --filter @seo/web preview:cloudflare --ip 127.0.0.1 --port \"$CONDUCTOR_PORT\" --show-interactive-dev-session false"
default = true
icon = "globe"
