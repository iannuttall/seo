packages:
  - apps/*
  - packages/*

overrides:
  "@hono/node-server": 2.0.11
  "@sentry/node": 10.60.0
  "@xmldom/xmldom": 0.9.12
  devalue: 5.9.1
  esbuild: 0.28.1
  fast-uri: 3.1.6
  "hono@<4.13.5": 4.13.5
  "js-yaml@3.15.0": 3.15.2
  "js-yaml@4.3.0": 4.3.2
  "nanoid@<3.3.18": 3.3.18
  postcss: 8.5.23
  "qs@<6.16.0": 6.16.0
  sharp: 0.35.4
  smol-toml: 1.7.1
  svgo: 4.1.0
  "undici@7.28.0": 7.29.0

# Exact transitive versions with upstream deprecation notices. Keep this list
# narrow so upgrades surface new notices instead of hiding them globally.
allowedDeprecatedVersions:
  prebuild-install: 7.1.3
  whatwg-encoding: 3.1.1

allowBuilds:
  esbuild@0.28.1: true
  sharp: set this to true or false
  sharp@0.35.4: true
  workerd@1.20260714.1: true

minimumReleaseAgeExclude:
  - '@iannuttall/seo-graph-astro'
  - '@iannuttall/seo-graph-core'
  - miniflare@4.20260708.1
  - wrangler@4.110.0
  - '@cloudflare/workers-types@5.20260716.1'
  - '@hono/node-server@2.0.11'
  - postcss@8.5.23
  - undici@7.29.0 || 8.9.0
  - fast-uri@3.1.5
  - hono@4.12.34
