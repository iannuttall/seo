name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:static
      - run: pnpm security:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v6
        id: turbo
        with:
          path: .turbo
          key: turbo-v1-${{ github.repository_id }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.repository_id }}-${{ runner.os }}-
      - run: pnpm build
      - uses: actions/cache/save@v6
        if: steps.turbo.outputs.cache-hit != 'true'
        with:
          path: .turbo
          key: turbo-v1-${{ github.repository_id }}-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ github.run_id }}
          path: |
            dist
            packages/cli/dist
            packages/core/dist
            packages/mcp/dist
          if-no-files-found: error
          retention-days: 1

  unit-tests:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: CLI help integration
            kind: cli-help
            shard: none
          - label: CLI remaining 1 of 3
            kind: cli-shard
            shard: 1/3
          - label: CLI remaining 2 of 3
            kind: cli-shard
            shard: 2/3
          - label: CLI remaining 3 of 3
            kind: cli-shard
            shard: 3/3
          - label: Core, MCP, and web
            kind: other
            shard: none
    name: Tests (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-v1-${{ github.repository_id }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.repository_id }}-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
          path: .
      - name: Run CLI help integration tests
        if: matrix.kind == 'cli-help'
        run: node --test packages/cli/dist/help.test.js
      - name: Run remaining CLI test shard
        if: matrix.kind == 'cli-shard'
        run: pnpm test:cli-shard:built ${{ matrix.shard }}
      - name: Run core, MCP, and web tests
        if: matrix.kind == 'other'
        run: pnpm exec turbo run test --filter=@seo/core --filter=@seo/mcp --filter=@seo/web

  contracts:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
          path: .
      - run: pnpm test:contracts:built

  resources:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
          path: .
      - run: pnpm test:resources:built

  package-install:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
          path: .
      - run: pnpm test:package-install:built

  typecheck:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-v1-${{ github.repository_id }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-v1-${{ github.repository_id }}-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: ci-build-${{ github.run_id }}
          path: .
      - run: pnpm typecheck

  checks:
    if: always()
    needs:
      - preflight
      - build
      - unit-tests
      - contracts
      - resources
      - package-install
      - typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm required jobs passed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          RESOURCES_RESULT: ${{ needs.resources.result }}
          PACKAGE_RESULT: ${{ needs.package-install.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          for result in \
            "$PREFLIGHT_RESULT" \
            "$BUILD_RESULT" \
            "$UNIT_RESULT" \
            "$CONTRACTS_RESULT" \
            "$RESOURCES_RESULT" \
            "$PACKAGE_RESULT" \
            "$TYPECHECK_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "One or more required CI jobs failed or were cancelled." >&2
              exit 1
            fi
          done
