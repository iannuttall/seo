"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "bash scripts/conductor-setup.sh"
archive = "true"
run_mode = "concurrent"

[scripts.run.web]
available_in = [ "local" ]
command = "pnpm --filter @seo/web dev --host 127.0.0.1 --port \"$CONDUCTOR_PORT\""
default = true
icon = "globe"
